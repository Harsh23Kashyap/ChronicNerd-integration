<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - DietNerd</title>
    <link rel="stylesheet" href="contact.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home-transition.css">
</head>
<body>
    <nav class="toolbar" aria-label="Primary navigation">
        <a class="brand" href="index.html"><img src="assets/dietnerd_dialogue.svg" alt="DietNerd"></a>
        <div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a class="active" href="contact.html" aria-current="page">Contact</a></div>
    </nav>
    <main class="contact-layout">
        <div class="contact-copy">
            <span class="eyebrow">Talk to us</span>
            <h1>Help shape<br><em>better answers.</em></h1>
            <p>Found a bug or have an idea for DietNerd? Tell us what happened, or what you would like to see next.</p>
            <div class="contact-aside"><span aria-hidden="true">↗</span><div><strong>Every note helps.</strong><br>We read feedback as we improve the research experience.</div></div>
        </div>
        <form id="contactForm" class="contact-form">
            <div class="form-heading"><span>Send a note</span><h2>We'd like to hear from you.</h2></div>
            <label for="name">Name</label>
            <input type="text" id="name" name="user_name" placeholder="Your name" autocomplete="name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="user_email" placeholder="you@example.com" autocomplete="email" required>
            <label for="feedback">Message</label>
            <textarea id="feedback" name="message" placeholder="Tell us a little about it..." rows="6" required></textarea>
            <p id="form-status" role="status" aria-live="polite"></p>
            <button type="submit" id="submit">Send message <span aria-hidden="true">→</span></button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="env.js"></script>
    <script>
        const form = document.getElementById('contactForm');
        const status = document.getElementById('form-status');
        const submit = document.getElementById('submit');
        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (!window.emailjs || !window.env?.EMAILJS_PUBLIC_KEY || !window.env?.EMAILJS_SERVICE_ID || !window.env?.EMAILJS_TEMPLATE_ID) {
                status.textContent = 'The contact form is not available right now. Please try again later.';
                return;
            }
            submit.disabled = true;
            status.textContent = 'Sending...';
            try {
                emailjs.init({publicKey: window.env.EMAILJS_PUBLIC_KEY});
                await emailjs.sendForm(window.env.EMAILJS_SERVICE_ID, window.env.EMAILJS_TEMPLATE_ID, form);
                form.reset();
                status.textContent = 'Thanks, your message was sent.';
            } catch (error) {
                status.textContent = 'Your message could not be sent. Please try again.';
            } finally { submit.disabled = false; }
        });
    </script>
<div id="home-transition" class="home-transition" role="status" aria-live="polite" hidden><div class="home-transition-emblem" aria-hidden="true"><span class="home-transition-orbit"></span><img src="assets/dietnerd_dialogue.svg" alt=""></div><strong>Opening DietNerd</strong><span class="home-transition-track" aria-hidden="true"></span></div>
<script src="home-transition.js"></script>
</body>
</html>
